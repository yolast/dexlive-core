name: Deploy to OCI Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to OCI via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            cd ~/dexlive
            
            # Pull latest changes from GitHub main
            git fetch origin main
            git reset --hard origin/main
            
            # Install dependencies and compile Next.js build
            npm ci --prefer-offline
            npm run build
            
            # Ensure PM2 is in PATH (adjust if using NVM)
            export PATH=$PATH:/usr/local/bin:/usr/bin
            
            # Reload application with zero downtime & save process list
            pm2 reload all || pm2 restart all
            pm2 save
            
            echo "✅ Deployment to OCI completed successfully!"